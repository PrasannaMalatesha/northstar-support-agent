[project]
name = "northstar-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/agent", "apps/api"]

[tool.uv.sources]
northstar-agent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "apps/api"]
testpaths = ["apps/api/tests"]
