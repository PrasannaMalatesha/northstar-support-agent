# The release bar is the API test. The axe scan is the console job.
# A PR into uat also needs the release bar's results file for its code (release-bar job).
# Either miss fails this workflow, so a push to uat does not deploy.
name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - uat
      - prod
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: northstar
          POSTGRES_DB: northstar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northstar -d northstar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --frozen --all-packages --group dev
      - name: Test
        run: uv run pytest
        env:
          DATABASE_URL: postgresql://northstar:northstar@localhost:5432/northstar
          TEST_DATABASE_URL: postgresql://northstar:northstar@localhost:5432/northstar_test

  web:
    name: Lint and build console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: northstar
          POSTGRES_DB: northstar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northstar -d northstar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-auth-secret-at-least-32-characters
          FASTAPI_URL: http://127.0.0.1:8000
          AUTH_TRUST_HOST: "true"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install API
        working-directory: ${{ github.workspace }}
        run: uv sync --frozen --all-packages
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility
        run: npx playwright test
        env:
          CI: "true"
          DATABASE_URL: postgresql://northstar:northstar@localhost:5432/northstar

  release-bar:
    # The release bar runs locally (CI has no keys) and commits results/release_bar.json.
    # A PR into uat must carry a passing file for the code it promotes. Other PRs skip this job.
    name: Release bar results
    if: github.event_name == 'pull_request' && github.base_ref == 'uat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check the results file
        run: python3 evals/release_check.py "${{ github.event.pull_request.head.sha }}"

  deploy:
    name: Deploy
    needs: [test, web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/prod')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the API
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set. Connect the Render service to this branch, or add the hook secret."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Deploy the console
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set. Connect the Vercel project to this branch, or add the hook secret."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
