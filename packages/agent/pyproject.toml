[project]
name = "northstar-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1.0",
    "flashrank>=0.2.10",
    "langchain-google-genai>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph>=1.0",
    "pyjwt>=2.10.0",
    "psycopg[binary]>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["northstar"]
